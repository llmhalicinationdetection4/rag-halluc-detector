[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halludetect"
version = "0.1.0"
description = "Claim-level NLI hallucination detection for RAG answers"
requires-python = ">=3.10"

[project.scripts]
halludetect = "halludetect.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not slow'"
markers = ["slow: loads real models or downloads data (deselected by default)"]
